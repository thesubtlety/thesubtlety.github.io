noticing: |
  Every serious compromise I’ve walked through has had roughly the same plot. Usually no zero-day. A token, service account, extension, or forgotten permission could reach more than anyone remembered granting, and the attacker found out first.

  The distance between what something is meant to touch and what it can touch is most of the job.

  Agents make that more interesting. The thing holding the credential now also reads untrusted text and decides what to do next. The desktop agent is the new browser, except we’re skipping thirty years of hardening and shipping it with prompt injection unresolved.

  Currently exploring problems like whether constrained encoding and decoding can make agent output boring enough to trust, what intent-based access control means when the intent arrives as prose, and what happens when both sides automate. Red teams already run fleets of agents. The defense worth building reaches the whole fleet at the first tripwire.

  The other recurring problem is measurement. The industry can measure less than it pretends to. The papers that changed my mind are on the [resources page](/resources/).
