noticing: |
  Most of the serious compromises I have been a part of didn't need a zero-day. Something already in the environment, a token, a service account, a browser extension, a forgotten permission, had more access than anyone remembered giving it. We noticed before the attackers or defenders.

  So much of the work is finding the gap between what a system is supposed to be able to reach and do and what it can actually reach, and then closing it.

  Agents are making this more interesting. The software holding the credential now also reads untrusted text and decides what to do with it. The desktop agent is the new browser, except we're skipping thirty years of hardening and shipping it with prompt injection unresolved. Agents need broad latitude, but must be task-constrained.

  Questions I'm thinking about now: whether constraining an agent's output to a fixed grammar makes it safe to act on, how to grant access based on what a user asked for, and what happens once attackers and defenders both run fleets of agents.

  The other problem is measurement. Security has little reliable evidence about which controls work. Papers that convinced me of that are on the [resources page](/resources/).
