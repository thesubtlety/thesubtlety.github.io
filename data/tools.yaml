# Tools shown on the site. `repo` drives build-time star/commit stats from the GitHub API;
# `stars` is a pinned fallback used when the API is unreachable. Update fallbacks occasionally.
featured:
  - name: geiger
    repo: puck-security/geiger
    url: https://github.com/puck-security/geiger
    lang: Go
    stars: 36
    description: Checks if leaked credentials still work and what they can access. Goes deeper with SaaS APIs to immediately uncover impact.
    origin: Built with the Puck Security folks.
  - name: tailsnitch
    repo: adversis/tailsnitch
    url: https://github.com/adversis/tailsnitch
    lang: Go
    stars: 1123
    description: Finds and helps fix Tailscale configuration problems. Hacker News claim to fame.
    origin: Built at Adversis.
  - name: sketchy
    repo: adversis/sketchy
    url: https://github.com/adversis/sketchy
    lang: Go
    stars: 72
    description: Checks software for signs of malicious code before you run it. Handy post-git clone tool.
    origin: Built at Adversis.
  - name: webauthn-bridge
    repo: thesubtlety/webauthn-bridge
    url: https://github.com/thesubtlety/webauthn-bridge
    lang: JavaScript
    stars: 1
    description: Tests WebAuthn and sign-in policies with a remote security key. All bets are off post-exploitation.
  - name: llmunculus
    repo: thesubtlety/llmunculus
    url: https://github.com/thesubtlety/llmunculus
    lang: C
    stars: 0
    description: Experimental portable executable with a tiny LLM and compiler that can send itself places. 2026 local LLMs are still weak.

