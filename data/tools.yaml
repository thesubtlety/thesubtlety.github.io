# Tools shown on the site. `repo` drives build-time star/commit stats from the GitHub API;
# `stars` is a pinned fallback used when the API is unreachable. Update fallbacks occasionally.
featured:
  - name: geiger
    repo: puck-security/geiger
    url: https://github.com/puck-security/geiger
    lang: Go
    stars: 36
    description: Checks leaked credentials to see whether they still work and what they can access. Supports over 100 credential types and uses read-only checks.
    origin: Built with the Puck Security folks.
  - name: tailsnitch
    repo: adversis/tailsnitch
    url: https://github.com/adversis/tailsnitch
    lang: Go
    stars: 1123
    description: Audits Tailscale ACLs and settings for 57 misconfigurations, with an interactive fix mode.
    origin: Built at Adversis.
  - name: sketchy
    repo: adversis/sketchy
    url: https://github.com/adversis/sketchy
    lang: Go
    stars: 72
    description: Scans repositories, packages, and install scripts for signs of malicious code before you run them.
    origin: Built at Adversis.
  - name: puck-scout
    repo: puck-security/puck-scout
    url: https://github.com/puck-security/puck-scout
    lang: Go, Rust
    stars: 23
    description: Investigates endpoints using read-only MCP agents, with policy checks and audit logging for every command. Accepts questions in plain English.
    origin: Built with Puck Security.
  - name: llmunculus
    repo: thesubtlety/llmunculus
    url: https://github.com/thesubtlety/llmunculus
    lang: C
    stars: 0
    description: A single executable containing a small LLM and C compiler. Generates, compiles, and runs programs to answer plain-English questions. Runs on Linux, macOS, and Windows.

groups:
