<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc"><title id="title">A sign-in request, end to end</title><desc id="desc">The requesting browser forwards options to the signing browser, which returns an assertion for website verification.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#47665e" stroke-width="1.5"/></marker></defs><rect width="1080" height="620" rx="18" fill="#edf3f2"/><rect x="19" y="24" width="182" height="47" rx="9" fill="white" stroke="#c5d5d0"/><text x="110" y="53" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#183b35">Website login tab</text><path d="M110 85V560" stroke="#bdcdc7" stroke-dasharray="5 7"/><rect x="234" y="24" width="182" height="47" rx="9" fill="white" stroke="#c5d5d0"/><text x="325" y="53" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#183b35">Requesting extension</text><path d="M325 85V560" stroke="#bdcdc7" stroke-dasharray="5 7"/><rect x="449" y="24" width="182" height="47" rx="9" fill="white" stroke="#c5d5d0"/><text x="540" y="53" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#183b35">Signing extension</text><path d="M540 85V560" stroke="#bdcdc7" stroke-dasharray="5 7"/><rect x="664" y="24" width="182" height="47" rx="9" fill="white" stroke="#c5d5d0"/><text x="755" y="53" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#183b35">Signing browser</text><path d="M755 85V560" stroke="#bdcdc7" stroke-dasharray="5 7"/><rect x="879" y="24" width="182" height="47" rx="9" fill="white" stroke="#c5d5d0"/><text x="970" y="53" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#183b35">YubiKey</text><path d="M970 85V560" stroke="#bdcdc7" stroke-dasharray="5 7"/><text x="217.5" y="112" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Request options</text><path d="M110 124H325" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="432.5" y="167" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Encrypted challenge via relay</text><path d="M325 179H540" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="647.5" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Match rule; open HTTPS page</text><path d="M540 234H755" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="862.5" y="277" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Native request; touch / PIN</text><path d="M755 289H970" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="862.5" y="332" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Signed assertion</text><path d="M970 344H755" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="647.5" y="387" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Credential JSON + binding checks</text><path d="M755 399H540" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="432.5" y="442" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Encrypted assertion via relay</text><path d="M540 454H325" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="217.5" y="497" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#244e43">Complete original request</text><path d="M325 509H110" stroke="#47665e" stroke-width="1.6" marker-end="url(#arrow)"/><text x="40" y="592" font-family="sans-serif" font-size="15" fill="#526b64">The website verifies the signature and decides whether login succeeds.</text></svg>