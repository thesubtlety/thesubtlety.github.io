<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 244" role="img" aria-labelledby="title desc"><title id="title">Requesting browser and signing browser</title><desc id="desc">Assertions return along the same path. The private key stays with the authenticator.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#617688" stroke-width="1.5"/></marker></defs><rect width="1080" height="244" rx="18" fill="#edf3f2"/><text x="40" y="44" font-family="monospace" font-size="12" fill="#53716a">01 / REQUESTING</text><rect x="40" y="67" width="224" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="58" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Website login tab</text><text x="58" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Receives the session</text><path d="M271 120H288" stroke="#617688" stroke-width="1.5" marker-end="url(#arrow)"/><text x="298" y="44" font-family="monospace" font-size="12" fill="#53716a">02 / REQUESTING</text><rect x="298" y="67" width="224" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="316" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Proxy extension</text><text x="316" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Request options + result</text><path d="M529 120H546" stroke="#617688" stroke-width="1.5" marker-end="url(#arrow)"/><text x="556" y="44" font-family="monospace" font-size="12" fill="#53716a">03 / TRANSPORT</text><rect x="556" y="67" width="224" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="574" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Cloudflare relay</text><text x="574" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Encrypted WSS packets</text><path d="M787 120H804" stroke="#617688" stroke-width="1.5" marker-end="url(#arrow)"/><text x="814" y="44" font-family="monospace" font-size="12" fill="#53716a">04 / SIGNING</text><rect x="814" y="67" width="224" height="108" rx="12" fill="white" stroke="#c5d5d0"/><text x="832" y="108" font-family="sans-serif" font-size="18" font-weight="600" fill="#183b35">Browser + YubiKey</text><text x="832" y="139" font-family="sans-serif" font-size="14" fill="#526b64">Authorized HTTPS page</text><text x="40" y="213" font-family="sans-serif" font-size="14" fill="#526b64">Assertions return along the same path. The private key stays with the authenticator.</text></svg>