baseURL = "https://www.thesubtlety.com/"
locale = "en-us"
title = "The Subtlety"
theme = "subtle"
enableRobotsTXT = true
timeZone = "America/Denver"

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  author = "Noah Potti"
  description = "Noah Potti on agent security, credentials, and what an attacker can actually reach."
  [[params.elsewhere]]
    name = "GitHub"
    url = "https://github.com/thesubtlety"
    note = "@thesubtlety, and @noahpotti"
  [[params.elsewhere]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/noahpotti"
  [[params.elsewhere]]
    name = "Adversis"
    url = "https://www.adversis.io"
  [[params.elsewhere]]
    name = "Puck Security"
    url = "https://puck.security"

[menus]
  [[menus.main]]
    name = "Writing"
    pageRef = "/post"
    weight = 10
  [[menus.main]]
    name = "Tools"
    pageRef = "/tools"
    weight = 20
  [[menus.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 30
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[caches]
  [caches.getresource]
    maxAge = "12h"
