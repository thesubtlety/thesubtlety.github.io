{{ define "main" }}
<article class="prose">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</article>
<section class="tool-group">
  <ul class="tools">
    {{- range partial "tools-by-date.html" hugo.Data.tools.all }}{{ partial "tool.html" . }}{{ end }}
  </ul>
</section>
{{- with hugo.Data.tools.contributions }}
<section class="tool-group prose">
  {{ with .title }}<h2>{{ . }}</h2>{{ end }}
  {{ .text | markdownify }}
</section>
{{- end }}
{{ end }}
