<header class="site-header">
  <a class="site-name" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
  <nav class="site-nav">
    {{- range .Site.Menus.main }}
    <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
