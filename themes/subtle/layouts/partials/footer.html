<footer class="site-footer">
  <span>{{ .Site.Params.author }} · {{ now.Year }}</span>
  <span class="footer-links">
    {{- range .Site.Params.elsewhere }}<a href="{{ .url }}"{{ if partial "is-external.html" .url }} target="_blank" rel="me noopener"{{ else }} rel="me"{{ end }}>{{ .name }}</a>{{ end -}}
  </span>
</footer>
