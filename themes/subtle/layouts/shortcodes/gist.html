{{- /* Hugo removed the built-in gist shortcode; older posts still use it. */ -}}
{{- $user := .Get 0 }}{{ $id := .Get 1 }}{{ $file := .Get 2 -}}
<script src="https://gist.github.com/{{ $user }}/{{ $id }}.js{{ with $file }}?file={{ . }}{{ end }}"></script>
<noscript><a href="https://gist.github.com/{{ $user }}/{{ $id }}">gist.github.com/{{ $user }}/{{ $id }}</a></noscript>
